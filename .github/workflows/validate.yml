name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'   # daily: catch release assets that changed after they were pinned
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node validate.mjs
